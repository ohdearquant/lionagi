[project]
name = "lionagi"
version = "0.36.0"
description = "An Intelligence Operating System."
authors = [
    { name = "HaiyangLi", email = "quantocean.li@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiocache>=0.12.0",
    "httpx>=0.28.1",
    "anyio>=4.14.2",
    # Imported directly by the flow kernel to detect the running async backend.
    # anyio dropped sniffio from its own dependencies in 4.10, so it is no
    # longer supplied transitively and must be declared here.
    "sniffio>=1.3.0",
    "json-repair>=0.58.0",
    # CommonMark parser: the Codex provider reads a turn's final message as a
    # Markdown reader sees it, to tell call markup written as prose from markup
    # quoted as code.
    "markdown-it-py>=3.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.8.0",
    "toml>=0.10.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.10.0",
    # lionagi/state/engine.py reads the private Connection._thread; widen the
    # bound once a new release is checked (tests/state/test_failed_open_worker.py).
    "aiosqlite>=0.22.0,<0.23",
    "sqlalchemy[asyncio]>=2.0.0",
    "orjson>=3.11.8",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
]
license = {file = "LICENSE"}
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Framework :: Pytest",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "ipython>=8.31.0",
    "tqdm>=4.67.1",
    "pytest-cov>=6.1.1",
    "ruff>=0.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings>=0.30.0",
    "mkdocstrings-python>=1.17.0",
    "trio>=0.30.0",
    "hypothesis>=6.152.2",
    "pyarrow>=21.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    # Tests that pass a msgspec Struct through the structural helpers; lionagi
    # accepts one when msgspec is installed and works without it.
    "msgspec>=0.20.0",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
li = "lionagi.cli.main:main"

[project.optional-dependencies]

ruvector = [
    "ruvector>=0.1.2,<0.2",
    "numpy>=1.24,<3",
]

ollama = [
    "ollama>=0.6.1",
    "tqdm>=4.67.1",
]

mcp = [
    "fastmcp>=3.4.10",
    # fastmcp -> mcp pulls Starlette transitively but mcp only pins
    # starlette>=0.27, so floor the patched version here too (mirrors [studio]).
    "starlette>=1.3.1",
    # fastmcp only requires mcp>=1.24.0,<2.0, which predates the advisories,
    # so pull the patched release forward here for the same dependency-hygiene
    # reason as starlette above. This extra covers both lionagi's MCP client use
    # and the `li mcp` server, which serves over stdio (not an HTTP transport),
    # so this floors the version we resolve rather than turning on any
    # server-side transport protection.
    "mcp>=1.30.0",
]

rich = [
    "rich>=13.0.0",
]

pandas = [
    "pandas>=1.3.0",
]

postgres = [
    # sqlalchemy[asyncio] is now a core dependency (the StateDB backend is
    # built on SQLAlchemy-Core for both the default sqlite path and postgres);
    # this extra only adds the postgres driver stack.
    "pydapter[postgres]>=1.3.2",
    "asyncpg>=0.27.0",
]

sqlite = [
    # aiosqlite is now a core dependency; this extra is kept for backwards
    # compatibility with existing `pip install lionagi[sqlite]` invocations.
    "aiosqlite>=0.22.0,<0.23",
]

graph = [
    "networkx>=3.0.0",
]

xml = [
    "xmltodict>=0.12.0",
]

ag2 = [
    "ag2[openai]>=0.13.0",
]

studio = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "starlette>=1.3.1",
    "croniter>=1.4",
]

all = [
    "lionagi[ollama]",
    "lionagi[mcp]",
    "lionagi[rich]",
    "lionagi[postgres]",
    "lionagi[graph]",
    "lionagi[sqlite]",
    "lionagi[xml]",
    "lionagi[ag2]",
    "lionagi[studio]"
]


[tool.ruff]
target-version = "py310"
line-length = 100
# Both import roots, so `lionhub` sorts as first-party like `lionagi`.
src = [".", "lionhub/src"]

[tool.ruff.lint]
extend-select = ["TID251"]
select = ["E", "F", "W", "B", "I", "UP", "N", "S", "A", "RUF013"]
ignore = [
    "N805",   # pydantic validator first-arg naming
    "A004",   # ExceptionGroup stdlib shadowing (compat shim)
    "UP035",  # typing imports needed for Python 3.10
    "UP006",  # typing generics needed for Python 3.10
    "UP007",  # X | Y union syntax needs 3.10+ (already using from __future__)
    "S101",   # assert usage (fine in non-web library)
    "E501",   # line length (handled by formatter)
    "W293",   # blank line whitespace (handled by formatter)
]

[tool.ruff.lint.flake8-bugbear]
# pydantic.Field in a default is the documented way to attach a description to a
# parameter; the FieldInfo it returns is inert, so B008's mutable-default hazard
# does not apply.
extend-immutable-calls = ["pydantic.Field", "lionhub.serve.mcp.server._arg"]

[tool.ruff.lint.per-file-ignores]
# Enforce shared helpers only in the migrated import and concurrency modules.
"!lionagi/{_auto,agent/settings,_class_registry,cli/engine,cli/machine,cli/main,cli/monitor,cli/orchestrate/_notify,service/_subagent_admission,service/connections/provider_config,service/connections/registry,state/lifecycle/callbacks,state/lifecycle/notify_settings,studio/registry,studio/scheduler/engine,studio/services/admin}.py" = ["TID251"]
"tests/**" = [
    "S",      # security rules relaxed in tests
    "A",      # builtin shadowing (test fixtures reuse names like `exit`, `aiter`)
    "B",      # bugbear relaxed in tests (assert patterns, loop vars, callables)
    "E402",   # import after pytest.importorskip (intentional)
    "E721",   # type comparison (test assertions)
    "E731",   # lambda assignment (test fixtures)
    "F401",   # unused imports (import-bridge tests verify importability)
    "F601",   # repeated dict keys (test fixture patterns)
    "F841",   # unused variable (test setup patterns)
    "UP045",  # X | None annotation (3.10 compat)
    "N",      # naming relaxed in tests
]
"cookbooks/**" = ["S101", "B904", "N"]
"scripts/**" = ["S", "E731"]
# LOG_CONFIG property mirrors the legacy Settings.Config.LOG attribute name.
"lionagi/config.py" = ["N802"]
"apps/studio/**" = [
    "S108",   # /tmp in dev server
    "B007",   # unused loop vars
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib.import_module" = {msg = "Use lionagi.ln.import_module in this migrated module."}
"asyncio.sleep" = {msg = "Use lionagi.ln.concurrency.sleep in this migrated module."}
"anyio.sleep" = {msg = "Use lionagi.ln.concurrency.sleep in this migrated module."}
"anyio.to_thread.run_sync" = {msg = "Use lionagi.ln.concurrency.run_sync in this migrated module."}

[tool.pytest.ini_options]
# --max-worker-restart belongs here rather than only in scripts/ci.sh, so that it
# reaches every caller that discovers this config and not only the ones that go
# through the wrapper script. A CLI flag beats addopts, so a caller that wants a
# different limit can still pass one.
#
# It was 0 because a replacement worker is not always scheduled, and the run then
# blocks in the controller's read() with no timeout able to see it. What that
# missed is the cost of the alternative: at 0, xdist shuts every worker down at
# the first crash, so the run ends there and prints counts that read like a whole
# suite, with thousands of collected tests left unrun and nothing in the output
# saying so; at 4 xdist may retry crashed workers until its restart limit is
# exhausted, and a run can still stop with tests missing. A job that
# hits the blocked-controller case sets MAX_WORKER_RESTART=0 (scripts/ci.sh) or
# passes --max-worker-restart=0. scripts/ci.sh checks distinct collected and
# reported test IDs; a caller who runs pytest directly gets no such check.
addopts = "-q -ra --strict-config --strict-markers --tb=short --maxfail=5 -n auto --dist loadfile --max-worker-restart=4"
# Strict, so that a test written for anyio (marked `anyio`, or taking the
# `anyio_backend` fixture) runs on the backend it is parametrized with. Auto
# mode hands every coroutine test to pytest-asyncio, which ran each [trio] case
# on asyncio. Coroutine tests that carry neither mark are handed to
# pytest-asyncio by tests/conftest.py, and async fixtures are declared with
# pytest_asyncio.fixture.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 300
timeout_method = "thread"
faulthandler_timeout = 270
markers = [
    "performance: marks tests as performance benchmarks",
    "flaky_quarantine: temporarily excluded from required CI by tests/quarantine.txt",
    "slow_timing: intentionally exercises a real wall-clock deadline with generous headroom",
    "slow: marks tests as slow (> 1 second)",
    "integration: exercises multiple Studio server components, FastAPI TestClient, SQLite, or filesystem state",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async",
    "property: marks tests as property-based tests",
    "migration: marks tests as migration/compatibility tests",
    "network: requires network access",
]
filterwarnings = [
    # Ignore Pydantic deprecation warnings from external datamodel-code-generator
    "ignore:The `parse_obj` method is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:The `dict` method is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:The `__fields_set__` attribute is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:^(?!lionagi\\.).*",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lionagi", "lionhub/src/lionhub"]
artifacts = [
    "lionagi/py.typed",
    "lionhub/src/lionhub/py.typed",
    "lionagi/casts/packs/*.yaml",
    "lionagi/studio/builtin_playbooks/*.playbook.yaml",
]

[tool.hatch.build]
exclude = [
    "lion1/*",
    "dev/*",
    "data/*",
    "notebooks/*",
    "tests/*",
    "*.pyc",
    "__pycache__",
    "temp_logs/*",
    "logs/*"
]

[tool.pyright]
include = ["lionagi", "lionhub/src/lionhub", "tests/typing/branch_chat.py"]
extraPaths = ["lionhub/src"]
exclude = [
    "apps/studio/frontend",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "dist",
    "build",
]
typeCheckingMode = "basic"
pythonVersion = "3.10"
# The codebase uses the implicit-Optional idiom (`param: X = None`) throughout;
# treat those parameters as `X | None` instead of flagging every call site.
strictParameterNoneValue = false
# Type-hygiene backlog (~1.4k findings, 2026-07-17): surfaced as warnings so
# editors reserve errors for genuine breakage. Re-promote per-rule as the
# sweep burns files down (start: session/branch.py, protocols/generic/pile.py,
# state/db.py).
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportCallIssue = "warning"
reportGeneralTypeIssues = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportOptionalSubscript = "warning"
reportOperatorIssue = "warning"
reportIndexIssue = "warning"
reportOptionalCall = "warning"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"

[tool.uv]
# Force minimum versions for transitive deps with known vulnerabilities
constraint-dependencies = [
    "authlib>=1.6.11",      # CVE: CSRF when using cache
    "python-multipart>=0.0.31",  # CVE: DoS via unbounded multipart part headers; quadratic querystring parsing; param smuggling
    "pytest>=9.0.3",        # CVE: vulnerable tmpdir handling
    "pyjwt>=2.15.0",        # CVE: PyJWK HMAC/alg-allowlist bypass, PyJWKClient SSRF + DoS; then
                            # pre-verification payload RecursionError DoS and OKP private
                            # JWKs whose x and d do not correspond
    "urllib3>=2.8.0",       # CVE: HTTPS proxy TLS settings ignored or overridden, chunked
                            # deflate infinite loop, unbounded chunk-size line buffered in
                            # memory
    # CVE: vulnerable OpenSSL bundled in wheels; then a Bleichenbacher oracle
    # in PKCS#7 EnvelopedData decryption via distinguishable errors and timing
    "cryptography>=50.0.0",
    "requests>=2.33.0",     # CVE: insecure temp file reuse in extract_zipped_paths
    "pygments>=2.20.0",     # CVE: ReDoS in GUID regex
    "pymdown-extensions>=11.0.0",  # CVE: path traversal in the b64 extension lets an <img src> read
                            # files outside base_path
    "opentelemetry-api>=1.45.1",  # CVE: unbounded tracestate parsing
]
