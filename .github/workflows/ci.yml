name: Continuous Integration

on:
  # No paths-ignore on push: a notebook-only push previously skipped the whole
  # workflow (GitHub Actions skips a run when every changed path matches
  # paths-ignore), including the publication-hygiene lint job, which itself
  # scans notebooks. A leak introduced only in a notebook must still be gated.
  push:
    branches: [ main, develop ]
  # No paths-ignore on pull_request either: ci-gate is a required status check,
  # so the workflow must report on every PR — a filtered-out PR would block on
  # a check that never runs.
  #
  # types is spelled out for the same reason, one event class further out. The
  # default is [opened, synchronize, reopened], which does not include
  # ready_for_review, so marking a draft PR ready raises no event and starts no
  # run. Whatever ci-gate last reported then stands as the required check on a
  # PR that has since changed state, and if a job is ever made conditional on
  # draft it will not have run at all. Listing the defaults back is mandatory:
  # naming types replaces them rather than adding to them.
  #
  # And no branches filter, the same principle a third time. A PR based on any
  # branch other than main or develop raised no event, so nothing here ever ran
  # on it. Its
  # base is unprotected, so the required checks do not apply either: the PR reads
  # mergeable with no suite behind it, and merging it carries never-tested code
  # into the parent branch, where the parent's own suite structurally cannot see
  # it. That failure is silent, which is why the filter goes rather than the
  # branch list growing.
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      python-matrix:
        description: Python versions for a manual diagnostic run
        required: true
        default: full
        type: choice
        options:
          - full
          - endpoints

permissions:
  contents: read

# Every checkout below sets `persist-credentials: false`. Most jobs install and
# run the pull request's own code, and a persisted token would sit in
# .git/config for that code to read; no step here needs it there.

concurrency:
  # A new push to a PR supersedes its own earlier run; pushes to a branch and
  # manual runs are never cancelled, because those results are a record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras
    - name: Lint Python
      run: scripts/ci.sh lint-python
    - name: Check feature-boundary inventory
      run: uv run --no-sync python scripts/check_feature_boundaries.py
    - name: Enforce pytest quarantine cap
      run: scripts/ci.sh lint-quarantine
    - name: Install ripgrep
      run: sudo apt-get install -y ripgrep
    - name: Lint publication hygiene
      run: scripts/ci.sh lint-hygiene

  core-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    # The other Python jobs all install extras, most with --all-extras and the
    # studio job with --extra studio. Under any of them a module which is
    # imported on a core path, but only ever supplied by some extra's
    # transitive tree, is indistinguishable from a properly declared
    # dependency: it is always present, so nothing ever fails. Installing the
    # base dependency set by itself is the only configuration in which that
    # distinction is observable, which is why this job exists separately
    # rather than as another step somewhere green.
    - name: Install with no extras
      run: |
        uv venv
        uv pip install .
    # Starting the CLI traverses the real import chain rather than a subset a
    # test happens to reach, so an undeclared import on a startup path fails
    # here instead of on a user's machine. The step runs outside the
    # checkout: from the repository root, Python would import the source
    # tree's lionagi instead of the installed one.
    - name: Core surface starts without extras
      working-directory: ${{ runner.temp }}
      run: |
        "$GITHUB_WORKSPACE/.venv/bin/li" --version
        "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
        import importlib
        import os
        import sys

        venv = os.path.join(os.environ["GITHUB_WORKSPACE"], ".venv")
        for module in (
            "lionagi",
            "lionagi.cli.main",
            "lionagi.operations.flow",
            "lionagi.session.branch",
            "lionagi.session.session",
            "lionagi.service.imodel",
            "lionhub.orchestration",
        ):
            importlib.import_module(module)
        # Both packages come from the installed wheel, not from the checkout.
        for name in ("lionagi", "lionhub"):
            origin = sys.modules[name].__file__
            assert origin.startswith(venv + os.sep), (name, origin)
        # A moved module's old import path is the same module object as its new one.
        old = importlib.import_module("lionagi.orchestration.patterns")
        assert old is importlib.import_module("lionhub.orchestration.patterns")
        print("core surface imported with base dependencies only")
        PY

  docs:
    needs: changes
    # The `needs: changes` edge exists only so the ADR steps below can read
    # needs.changes.outputs.adr; the rest of this job (docs contracts, strict
    # build, markdownlint, link check) does not depend on that output. Gating
    # the whole job on the changes job succeeding would skip all of it when
    # changes fails or is skipped, which is how those checks silently stopped
    # running. The ADR steps stay output-gated and simply skip when the output
    # is absent.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install docs dependencies
      run: uv sync --frozen --all-extras

    - name: Test documentation contracts
      run: uv run pytest -n0 tests/docs

    - name: Build documentation strictly
      run: uv run mkdocs build --strict --site-dir /tmp/lionagi-docs-site

    - name: Lint markdown (formatting)
      uses: DavidAnson/markdownlint-cli2-action@v25
      with:
        # globs is newline-delimited; the action's `separator` input defaults to
        # "\n". A single comma-joined string is taken as one literal glob, matches
        # no file, and the step then passes having linted nothing at all.
        globs: |
          docs/**/*.md
          README.md
          AGENT.md
          CLAUDE.md
          CONTRIBUTING.md
          CHANGELOG.md
        config: ".markdownlint.jsonc"

    - name: Check internal links
      uses: lycheeverse/lychee-action@v2
      with:
        # --fallback-extensions md: pages use mkdocs directory URLs (href="api/operations/")
        #   which map to source api/operations.md; let lychee resolve the .md source offline.
        # --exclude-path docs/overrides: theme template partials contain Jinja ({{ ... }}),
        #   not documentation links.
        args: "--no-progress --offline --fallback-extensions md --exclude-path docs/overrides docs/ README.md AGENT.md CLAUDE.md CONTRIBUTING.md"
        fail: true

    # Only when docs/adr/ or the lifecycle policy registry itself changed —
    # this check compares the two against each other, so an unrelated docs
    # PR has nothing new to verify.
    - name: Check ADR status sets against the lifecycle policy registry
      if: needs.changes.outputs.adr == 'true'
      run: uv run python scripts/check_adr_status_sets.py

  test:
    runs-on: ubuntu-latest
    # Every job in this workflow has a timeout. After a worker crash the
    # pytest-xdist controller can block with no test running, where no per-test
    # timeout reaches it (the max-worker-restart note in pyproject.toml).
    # Unbounded, that leg runs to the six-hour job limit, and because runs on a
    # pushed branch share one concurrency group and are never cancelled, every
    # push in the meantime queues behind it and all but the newest are cancelled
    # without running. A leg takes 11 to 29 minutes. The test steps stop at 45,
    # before the job's 60, so a stopped leg still runs the failure telemetry and
    # the peak-RSS report, which names the test a crashed worker was running.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The full supported set on every event, pull_request included. This
        # used to be oldest + newest on PRs, which made the gate's population a
        # strict subset of the supported population: a failure exclusive to
        # 3.11, 3.12 or 3.13 could not be seen before merge and reached main by
        # construction, which is what happened. It is the same silent-population
        # defect the paths-ignore, types and branches notes above each describe,
        # and it survived those three passes because it was shaped like a cost
        # decision rather than a filter. The cost it saved was runner minutes,
        # which are free for a public repository on standard runners; the legs
        # run in parallel, so wall-clock is the slowest leg either way. The
        # `endpoints` choice stays, as an explicit manual diagnostic.
        python-version: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.python-matrix == 'endpoints') && '["3.10","3.14"]' || '["3.10","3.11","3.12","3.13","3.14"]') }}
    # Force every `uv` call (venv, sync, run) onto the matrix interpreter; the
    # repo's .python-version (3.10) otherwise pins all legs to 3.10.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PYTEST_JUNIT_XML: ${{ github.workspace }}/.pytest-results/junit.xml
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache uv downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras

    # Coverage runs on 3.10, only on pushes and manual runs — never on a pull
    # request.
    #
    # Running the suite under coverage instrumentation is materially slower than
    # running it plain. The 3.10 leg runs on every pull request and ci-gate
    # hard-gates on `test`, so before this split that extra time sat
    # directly on the path every pull request had to clear before it could merge.
    #
    # Coverage is a report rather than a gate, so pushes to a long-lived branch
    # are a sufficient place to produce it. Pull requests run the same tests on
    # the same interpreters, uninstrumented — no test is skipped on a pull
    # request, the 3.10 leg is switched from the instrumented command to the
    # plain one.
    - name: Run tests with coverage
      if: matrix.python-version == '3.10' && github.event_name != 'pull_request'
      timeout-minutes: 45
      run: scripts/ci.sh test-python-cov
      env:
        MAXFAIL: 25
        PYTEST_RSS_LOG: ${{ github.workspace }}/.pytest-rss

    - name: Run tests
      if: matrix.python-version != '3.10' || github.event_name == 'pull_request'
      timeout-minutes: 45
      run: scripts/ci.sh test-python
      env:
        MAXFAIL: 0
        PYTEST_RSS_LOG: ${{ github.workspace }}/.pytest-rss

    - name: Collect flake failure telemetry
      if: failure()
      run: |
        uv run python scripts/collect_flake_failures.py \
          --junit "$PYTEST_JUNIT_XML" \
          --output .pytest-results/failures.jsonl \
          --matrix-leg "${{ matrix.python-version }}" \
          --run-id "${{ github.run_id }}" \
          --attempt "${{ github.run_attempt }}"

    - name: Upload flake failure telemetry
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: flake-failures-py${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
        path: .pytest-results/failures.jsonl
        if-no-files-found: error
        retention-days: 30

    # Names the memory hog when a worker is OOM-killed ("node down: Not
    # properly terminated" with no traceback): per-worker peak RSS plus the
    # tests that raised the high-water mark most. Runs even when tests fail —
    # that is the case it exists for.
    - name: Worker peak-RSS report
      if: always()
      run: |
        if ls .pytest-rss/rss-*.jsonl >/dev/null 2>&1; then
          python3 scripts/rss_report.py .pytest-rss
        else
          echo "no RSS log produced"
        fi

    - name: Retain pytest timing evidence
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: pytest-timing-py${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
        path: |
          .pytest-results/junit.xml
          .pytest-rss/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.10' && github.event_name != 'pull_request'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ohdearquant/lionagi

  # Wall-clock gates run serially on one primary interpreter, outside coverage
  # and xdist. This job is intentionally advisory (absent from ci-gate) because
  # hosted-runner load can move timing, but failures remain visible as a red job.
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras
    - name: Run performance tests serially
      run: uv run pytest -m "performance" -p no:randomly -n 0 -q --timeout=300 --maxfail=0

  # A visible holding lane for known flakes. It is deliberately absent from
  # ci-gate and cannot block merges; exact tests come from tests/quarantine.txt.
  quarantine:
    continue-on-error: true
    runs-on: ubuntu-latest
    # The same hang as `test` (see there); this lane takes about a minute.
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      PYTEST_JUNIT_XML: ${{ github.workspace }}/.pytest-results/junit.xml
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras
    - name: Run quarantined tests only
      timeout-minutes: 10
      run: scripts/ci.sh test-python-quarantine
      env:
        MAXFAIL: 0
        PYTEST_RSS_LOG: ${{ github.workspace }}/.pytest-rss
    - name: Collect quarantine failure telemetry
      if: failure()
      run: |
        uv run python scripts/collect_flake_failures.py \
          --junit "$PYTEST_JUNIT_XML" \
          --output .pytest-results/failures.jsonl \
          --matrix-leg "quarantine-3.12" \
          --run-id "${{ github.run_id }}" \
          --attempt "${{ github.run_attempt }}"
    - name: Upload quarantine failure telemetry
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: flake-failures-quarantine-attempt-${{ github.run_attempt }}
        path: .pytest-results/failures.jsonl
        if-no-files-found: error
        retention-days: 30
    - name: Worker peak-RSS report
      if: always()
      run: |
        if ls .pytest-rss/rss-*.jsonl >/dev/null 2>&1; then
          python3 scripts/rss_report.py .pytest-rss
        else
          echo "no RSS log produced"
        fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio/frontend
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: apps/studio/frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Format check
      # The pre-commit formatter only sees files staged in a commit that ran
      # it, so drift survives whenever that does not happen. This checks the
      # tree as it stands.
      run: npm run format:check
    - name: Lint + typecheck
      run: |
        npm run lint
        npm run typecheck
    - name: Unit tests
      run: npm run test
    - name: Build
      run: npm run build

  studio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install Python dependencies
      run: |
        uv venv
        uv sync --extra studio
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: apps/studio/frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: apps/studio/frontend
      run: npm ci
    # No --with-deps: it runs apt on the runner, which has hung for the whole
    # 15-minute job budget when an Ubuntu mirror is unreachable, and the runner
    # image already ships Chrome and the shared libraries Chromium needs. If one
    # is ever genuinely missing, the e2e step below fails immediately and names
    # it, which is a better failure than a silent timeout.
    - name: Install Playwright browsers
      working-directory: apps/studio/frontend
      run: npx playwright install chromium
    # Builds the SPA, boots a seeded daemon + `vite preview` on temp/free-port
    # infrastructure (never the real ~/.lionagi), and runs the Chromium smoke
    # specs against it -- see apps/studio/frontend/e2e/ and tests/e2e_studio/.
    - name: Run seeded-daemon e2e smoke tests
      working-directory: apps/studio/frontend
      run: npm run e2e
    # The stop/resume test in the Operator suite has failed intermittently: after
    # the page reloads, the daemon stops answering and every later request
    # returns 502. The smoke step above runs it once, which is not enough to
    # catch an intermittent failure there, so it is repeated three more times
    # against the same build. Its own global setup boots a fresh seeded daemon
    # and preview server on free ports, so this invocation starts cleanly on its
    # own.
    - name: Repeat the Operator stop/resume test
      working-directory: apps/studio/frontend
      run: npx playwright test e2e/operator.spec.ts -g "Operator streams, persists, stops, records a run, and resumes it" --repeat-each 3
    # The bundle also carries the daemon and preview server logs from
    # apps/studio/frontend/e2e-logs/, which is where a mid-run server failure
    # is explained.
    - name: Upload Playwright report and server logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: studio-e2e-playwright-report
        path: |
          apps/studio/frontend/playwright-report/
          apps/studio/frontend/test-results/
          apps/studio/frontend/e2e-logs/
        if-no-files-found: warn
        retention-days: 7
    # The daemon and preview server logs are uploaded on every run, so a passing
    # run carries them too: a failure can be read against a run that passed, and
    # a run without them is visible as a failed step rather than a missing file.
    - name: Upload server logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: studio-e2e-server-logs
        path: apps/studio/frontend/e2e-logs/
        if-no-files-found: error
        overwrite: true
        retention-days: 7

  # Detect which conditional-job inputs changed, to gate the jobs below.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      studio: ${{ steps.filter.outputs.studio }}
      adr: ${{ steps.filter.outputs.adr }}
      imports: ${{ steps.filter.outputs.imports }}
      lionrs: ${{ steps.filter.outputs.lionrs }}
      lion1: ${{ steps.filter.outputs.lion1 }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          studio:
            - 'apps/studio/**'
            - 'lionagi/**'
            - 'lionhub/**'
            - 'pyproject.toml'
            - 'README.md'
            - 'LICENSE'
            - 'marketplace/**'
            - '.claude-plugin/**'
            # Not copied by the Dockerfile, but it decides what every COPY in
            # it resolves to: excluding a source here makes the build fail
            # while matching none of the source paths above.
            - '.dockerignore'
            - '.github/workflows/ci.yml'
          adr:
            - 'docs/adr/**'
            - 'lionagi/state/lifecycle/**'
          imports:
            - 'lionagi/**'
            - 'lionhub/**'
            - 'pyproject.toml'
            - 'uv.lock'
            - '.github/workflows/ci.yml'
          lionrs:
            - 'lionrs/**'
            - '.github/workflows/ci.yml'
          lion1:
            - 'lion1/**'
            - '.github/workflows/ci.yml'

  # Build the Studio image (Vite SPA + FastAPI single-origin) whenever its inputs
  # change, so a broken image is caught on the PR that breaks it instead of at
  # release time — release.yml is the only other place the Dockerfile is built.
  # Build only, no push; layers cached via the GitHub Actions cache. Skipped only
  # when the path-filter job succeeded and reported no image-relevant changes;
  # ci-gate treats any other skip/failure/cancellation of this job as a failure.
  studio-docker:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.studio == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
    - name: Build Studio image (no push)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
      with:
        context: .
        file: apps/studio/Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # `import lionagi` is deliberately light: measured at well under a second
  # with ZERO heavy libraries loaded eagerly (no pydantic, no httpx, no
  # provider SDKs — they all load lazily at first use). That property decays
  # one convenient top-level import at a time, and nothing else in CI
  # notices: core-install proves the bare package IMPORTS with base
  # dependencies, not that the heavy modules stay unloaded or that import
  # time holds a budget. These two jobs used to live in a standalone
  # workflow, where a red could not block a merge — a separate workflow
  # cannot join a `needs:` list across files — so they moved here, onto the
  # aggregate, path-gated the same way studio-docker is.
  minimal-import:
    name: Bare install imports within budget
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.imports == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install runtime deps only
        run: |
          uv venv
          uv sync --no-dev
      - name: Import lionagi, timed
        # Three fresh interpreters, best-of-three: absorbs runner FS cold-cache
        # noise while still catching a real regression (an eager heavy import
        # multiplies the time, it doesn't nudge it). Budget is ~8x the measured
        # local time, so a failure is structural, not jitter.
        #
        # --no-sync is load-bearing, not tidiness. `uv run` syncs the project
        # environment before it runs anything, and its default set includes the
        # dev group, so a plain `uv run` here would reinstall everything the
        # `uv sync --no-dev` above deliberately left out and this job would time
        # an import against an environment no user has.
        run: |
          uv run --no-sync python - <<'EOF'
          import subprocess, sys
          times = []
          for _ in range(3):
              out = subprocess.run(
                  [sys.executable, "-c",
                   "import time; t0=time.perf_counter(); import lionagi; "
                   "print(time.perf_counter()-t0)"],
                  capture_output=True, text=True,
              )
              if out.returncode != 0:
                  print(out.stderr, file=sys.stderr)
                  raise SystemExit("bare `import lionagi` failed in a no-extras environment")
              times.append(float(out.stdout.strip()))
          best = min(times)
          print(f"::notice::cold `import lionagi` best-of-3: {best:.3f}s (runs: {[f'{t:.3f}' for t in times]})")
          BUDGET = 2.0
          if best > BUDGET:
              raise SystemExit(f"import took {best:.3f}s, budget is {BUDGET}s — something heavy became eager")
          EOF

  no-eager-heavies:
    name: Full install stays lazy
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.imports == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install everything
        run: |
          uv venv
          uv sync --all-extras
      - name: Bare import must not load heavy modules
        # The list is what a bare import measurably does NOT load today. A
        # name appearing in sys.modules after `import lionagi` means someone
        # promoted a lazy import to top level — the fix is to demote it, not
        # to shrink this list.
        run: |
          uv run python - <<'EOF'
          import sys
          import lionagi  # noqa: F401
          heavies = [
              "pydantic", "httpx", "aiohttp", "openai", "anthropic",
              "fastapi", "uvicorn", "starlette", "sqlalchemy", "aiosqlite",
              "pandas", "matplotlib", "playwright", "torch", "litellm",
          ]
          eager = [m for m in heavies if m in sys.modules]
          if eager:
              raise SystemExit(f"bare `import lionagi` eagerly loaded: {eager}")
          print(f"::notice::bare import loaded none of the {len(heavies)} guarded heavy modules")
          EOF

  lionrs:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.lionrs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lionrs/crates
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Lint
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --workspace --all-features --locked

  # lion1/ is a project of its own, with its own pyproject, lock, pre-commit config and
  # suite; this job is lion1's checks as they ran in its own repository. It runs when
  # lion1/ or this workflow changes; ci-gate accepts its skip only then.
  lion1:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.lion1 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lion1
    env:
      HYPOTHESIS_PROFILE: ci
      FORCE_COLOR: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: lion1/uv.lock
    - name: pre-commit (ruff, ruff format, the ADR register)
      run: uvx pre-commit run --config .pre-commit-config.yaml --all-files --show-diff-on-failure
    - name: the interpreter is 3.11
      run: uv run --locked --python 3.11 python -c "import sys; assert sys.version.startswith('3.11.'), sys.version; print(sys.version)"
    - name: pytest
      run: uv run --locked --python 3.11 pytest --cov --cov-report=term-missing

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/vscode
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: apps/vscode/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Build
      run: npm run compile
    - name: Test
      run: npm run test

  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install ripgrep
      run: sudo apt-get install -y ripgrep
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: uv sync --frozen
    - name: Lint marketplace
      run: scripts/ci.sh lint-marketplace

  # Single aggregate context for branch protection. Required status checks must
  # reference this job, never the matrix legs directly: matrix names shift with
  # the event (a manual run can ask for a subset of Python versions) and a renamed leg would
  # strand PRs on a check that never reports. Fail-closed: every hard gate must
  # report success; a skipped, failed, or cancelled hard gate fails the aggregate.
  # The conditional jobs (studio-docker, minimal-import, no-eager-heavies,
  # lionrs, lion1) may
  # skip only when the changes path-filter job itself succeeded and reported
  # their inputs unchanged; any other skip, failure, or cancellation fails the
  # aggregate.
  ci-gate:
    if: ${{ always() }}
    needs: [lint, core-install, docs, test, frontend, studio-e2e, changes, studio-docker, minimal-import, no-eager-heavies, lionrs, lion1, vscode, marketplace]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - name: Check aggregate result
      env:
        NEEDS_CONTEXT: ${{ toJSON(needs) }}
      run: |
        python - <<'PY'
        import json
        import os
        import sys

        needs = json.loads(os.environ["NEEDS_CONTEXT"])
        hard_gates = [
            "lint",
            "core-install",
            "docs",
            "test",
            "frontend",
            "studio-e2e",
            "changes",
            "vscode",
            "marketplace",
        ]

        bad = [
            f"{name}={needs[name]['result']}"
            for name in hard_gates
            if needs[name]["result"] != "success"
        ]

        # Conditional jobs: each may skip only when the path-filter output that
        # gates it reports its inputs unchanged.
        conditional_gates = {
            "studio-docker": "studio",
            "minimal-import": "imports",
            "no-eager-heavies": "imports",
            "lionrs": "lionrs",
            "lion1": "lion1",
        }
        for job, flag in conditional_gates.items():
            changed = needs["changes"].get("outputs", {}).get(flag)
            result = needs[job]["result"]
            if changed == "true":
                if result != "success":
                    bad.append(f"{job}={result} while {flag} inputs changed")
            elif changed == "false":
                if result not in ("success", "skipped"):
                    bad.append(f"{job}={result} while {flag} inputs did not change")
            else:
                bad.append(f"changes.outputs.{flag}={changed!r} (expected 'true' or 'false')")

        if bad:
            print("ci-gate failed:", ", ".join(bad))
            sys.exit(1)

        print("ci-gate passed: required jobs succeeded; conditional-job skips, if any, were path-filtered")
        PY

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Build package
      run: uv build
