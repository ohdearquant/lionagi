name: marketplace-lint

on:
  # ready_for_review is not a default activity type, so without this a draft PR
  # marked ready starts no run. Naming types replaces the defaults rather than
  # extending them, so the three defaults are listed back.
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'marketplace/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'README.md'
      - 'scripts/ci.sh'
      - 'tests/marketplace_lint.py'

concurrency:
  # A new push to a PR supersedes its own earlier run; pushes to a branch and
  # manual runs are never cancelled, because those results are a record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Lint marketplace content + manifests
        run: scripts/ci.sh lint-marketplace
