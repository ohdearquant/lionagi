name: Type Check (advisory)

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.ipynb'
  # ready_for_review is not a default activity type, so without this a draft PR
  # marked ready starts no run. Naming types replaces the defaults rather than
  # extending them, so the three defaults are listed back.
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.ipynb'

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes its own earlier run; pushes to a branch and
  # manual runs are never cancelled, because those results are a record.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache uv downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-py3.10-typecheck-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py3.10-typecheck-

    - name: Install dependencies
      run: |
        uv venv --python 3.10
        uv sync --all-extras

    - name: Run pyright
      run: uvx pyright==1.1.402 --outputjson > /tmp/pyright_output.json || true

    - name: Check Branch chat overload contract
      run: uvx pyright==1.1.402 tests/typing/branch_chat.py

    - name: Check against baseline (advisory)
      continue-on-error: true
      run: uv run python scripts/check_pyright_baseline.py /tmp/pyright_output.json

    - name: Report summary
      if: always()
      run: |
        ERRORS=$(python3 -c "import json; d=json.load(open('/tmp/pyright_output.json')); print(d['summary']['errorCount'])" 2>/dev/null || echo "N/A")
        BASELINE=$(cat .github/pyright-baseline.txt)
        echo "### Pyright type-check summary" >> $GITHUB_STEP_SUMMARY
        echo "| | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Current errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
        echo "| Baseline | $BASELINE |" >> $GITHUB_STEP_SUMMARY
