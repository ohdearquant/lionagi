name: Release

on:
  release:
    types: [published]
  # Repair an image using this workflow on the default branch, while testing
  # and building the exact source that published the requested wheel.
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to repair from the default branch, without v (e.g. 0.35.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  INPUT_VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_ID: ${{ github.event.release.id }}
  RELEASE_ACTION: ${{ github.event.action }}

jobs:
  source:
    permissions:
      contents: read
      actions: read
    # Only the lionagi v-prefixed release tag namespace belongs here.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Validate the release and resolve its source
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/resolve_image_release.py

  test:
    permissions:
      contents: read
    needs: source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - name: Require the resolved source commit
      shell: bash
      env:
        RESOLVED_SHA: ${{ needs.source.outputs.sha }}
      run: |
        if [[ ! "${RESOLVED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo '::error::the release did not resolve a full source commit'
          exit 1
        fi
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.source.outputs.sha }}
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras
    
    - name: Run tests
      run: |
        source .venv/bin/activate
        uv run pytest --asyncio-mode=auto --maxfail=1 --disable-warnings tests/

  deploy:
    permissions:
      contents: read
    needs: [source, test]
    # Publishing the wheel belongs to the release that created the version, and
    # to nothing else. A manual dispatch exists to republish an image for a
    # version that already shipped, so its wheel is already on PyPI; letting
    # this job run would attempt a duplicate upload and fail the run for a
    # reason unrelated to what was asked for. The image job checks PyPI after
    # this job finishes, including when an upload succeeds but reports failure.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - name: Require the resolved source commit
      shell: bash
      env:
        RESOLVED_SHA: ${{ needs.source.outputs.sha }}
      run: |
        if [[ ! "${RESOLVED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo '::error::the release did not resolve a full source commit'
          exit 1
        fi
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.source.outputs.sha }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv venv
        uv pip install twine
    
    - name: Build package
      run: uv build
    
    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}
      run: uv run twine upload dist/*

  docker:
    needs: [source, test, deploy]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.test.result == 'success' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
    # Keep the PyPI decision, image push and digest verification in one slot.
    concurrency:
      group: lion-studio-image
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
    steps:
    - name: Require the resolved source commit
      shell: bash
      env:
        RESOLVED_SHA: ${{ needs.source.outputs.sha }}
      run: |
        if [[ ! "${RESOLVED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo '::error::the release did not resolve a full source commit'
          exit 1
        fi
    # Keep current workflow helpers separate from an older release's source.
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        path: .release-control
        persist-credentials: false
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.source.outputs.sha }}
        path: source
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Revalidate the source and published wheel
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        RESOLVED_SHA: ${{ needs.source.outputs.sha }}
        RESOLVED_VERSION: ${{ needs.source.outputs.version }}
      run: python .release-control/scripts/resolve_image_release.py --prepare-image

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

    # Setting up buildx pulls the BuildKit image from Docker Hub, so this step
    # depends on a registry outside this project. A transient 502 there is what
    # cost the 0.31.0 release its image. One retry covers the transient case; a
    # sustained outage still fails the job, which is the right outcome.
    - name: Set up Docker Buildx
      id: buildx
      continue-on-error: true
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

    - name: Set up Docker Buildx (second attempt)
      if: steps.buildx.outcome == 'failure'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image (multi-arch)
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
      with:
        context: ./source
        file: source/apps/studio/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/ohdearquant/lion-studio:${{ needs.source.outputs.version }}
          ${{ steps.release.outputs.publish_latest == 'true' && 'ghcr.io/ohdearquant/lion-studio:latest' || '' }}
        labels: |
          org.opencontainers.image.version=${{ needs.source.outputs.version }}
          org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify the published image digest
      if: ${{ !cancelled() }}
      env:
        VERSION: ${{ needs.source.outputs.version }}
        EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
        PUBLISH_LATEST: ${{ steps.release.outputs.publish_latest }}
      run: bash .release-control/scripts/verify_release_image.sh

  # Preserve a failing verification gate for any failed publication attempt.
  verify-image:
    permissions:
      contents: read
    needs: [source, docker]
    if: ${{ always() && needs.source.result == 'success' && needs.docker.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
    - name: Require successful image publication and verification
      shell: bash
      env:
        DOCKER_RESULT: ${{ needs.docker.result }}
        EXPECTED_DIGEST: ${{ needs.docker.outputs.digest }}
      run: |
        if [ "${DOCKER_RESULT}" != success ]; then
          echo '::error::image publication or digest verification did not succeed'
          exit 1
        fi
        if [[ ! "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo '::error::the image build did not produce a valid digest'
          exit 1
        fi
