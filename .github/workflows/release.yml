name: Release

on:
  release:
    types: [published]
  # Manual re-publish of the container image for a version whose release run
  # did not push one. Three releases have lost their image and none of them
  # could get it back, because a release-triggered run is the only thing that
  # builds the image and a release publishes exactly once. Re-running the old
  # run does not help: it rebuilds the tag's tree, which is the tree that
  # failed. Dispatch at a ref that carries the fix instead.
  #
  # The wheel is never re-published this way -- see the deploy job's guard.
  # Dispatch at a ref whose content matches the version being named, or the
  # image will not match the wheel already on PyPI.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish the image for, without the leading v (e.g. 0.35.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv venv
        uv sync --all-extras
    
    - name: Run tests
      run: |
        source .venv/bin/activate
        uv run pytest --asyncio-mode=auto --maxfail=1 --disable-warnings tests/

  deploy:
    needs: test
    # Publishing the wheel belongs to the release that created the version, and
    # to nothing else. A manual dispatch exists to republish an image for a
    # version that already shipped, so its wheel is already on PyPI; letting
    # this job run would attempt a duplicate upload and fail the run for a
    # reason unrelated to what was asked for. The docker job depends on test
    # rather than on this, so skipping here does not skip the image.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv venv
        uv pip install twine
    
    - name: Build package
      run: uv build
    
    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}
      run: uv run twine upload dist/*

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

    # Setting up buildx pulls the BuildKit image from Docker Hub, so this step
    # depends on a registry outside this project. A transient 502 there is what
    # cost the 0.31.0 release its image. One retry covers the transient case; a
    # sustained outage still fails the job, which is the right outcome.
    - name: Set up Docker Buildx
      id: buildx
      continue-on-error: true
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

    - name: Set up Docker Buildx (second attempt)
      if: steps.buildx.outcome == 'failure'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # On a release, the ref name is the tag and stripping the v gives the
    # version. On a dispatch the ref name is whatever branch was dispatched, so
    # the input is the only thing that knows the version and it is required.
    # Refusing an empty result matters more than it looks: an unset version
    # silently tags the image ":" and "latest", which publishes a broken tag
    # under a name that reads as success.
    - name: Resolve version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
        if [ -z "${version}" ]; then
          echo "::error::could not resolve a version from inputs or ${GITHUB_REF_NAME}"
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image (multi-arch)
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
      with:
        context: .
        file: apps/studio/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ghcr.io/ohdearquant/lion-studio:latest
          ghcr.io/ohdearquant/lion-studio:${{ steps.version.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Reads the tag back from the registry rather than trusting the push step's
  # exit, because those are different claims and the second is the one a user
  # depends on. Its own job so it still runs when the docker job failed or was
  # cancelled, which is how both missing images happened, and so an absent image
  # fails something whose name says what is missing.
  verify-image:
    needs: docker
    if: ${{ always() && needs.docker.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
    # On a release, the ref name is the tag and stripping the v gives the
    # version. On a dispatch the ref name is whatever branch was dispatched, so
    # the input is the only thing that knows the version and it is required.
    # Refusing an empty result matters more than it looks: an unset version
    # silently tags the image ":" and "latest", which publishes a broken tag
    # under a name that reads as success.
    - name: Resolve version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
        if [ -z "${version}" ]; then
          echo "::error::could not resolve a version from inputs or ${GITHUB_REF_NAME}"
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Verify the image is in the registry
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        set -euo pipefail
        repo=ohdearquant/lion-studio

        list_tags() {
          local token
          token="$(curl -sSf "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token')" || return 1
          curl -sSf -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${repo}/tags/list" | jq -r '.tags[]?'
        }

        query_ok=0
        count=0

        # A newly pushed tag can take a moment to appear, so give it a few tries
        # before calling it absent.
        for attempt in 1 2 3 4 5; do
          if tags="$(list_tags)"; then
            query_ok=1
          else
            query_ok=0
            tags=""
          fi
          count="$(printf '%s\n' "${tags}" | grep -c . || true)"

          # Positive control. An absence only means something if the query that
          # reported it finished and returned some other tag. Both halves are
          # needed: an empty listing and a missing tag read identically, and a
          # read that dies partway leaves output behind, so output alone would
          # let a broken read be reported as a missing image. Status and content
          # are separate claims and this asks for both.
          if [ "${query_ok}" -eq 0 ] || [ "${count}" -eq 0 ]; then
            echo "Attempt ${attempt}: could not list tags for ${repo}."
          elif printf '%s\n' "${tags}" | grep -qxF "${VERSION}"; then
            echo "ghcr.io/${repo}:${VERSION} is present; ${count} tags listed."
            exit 0
          else
            echo "Attempt ${attempt}: ${count} tags listed, ${VERSION} not among them."
          fi
          sleep 15
        done

        if [ "${query_ok}" -eq 0 ] || [ "${count}" -eq 0 ]; then
          echo "::error::Could not list tags for ${repo}. This check cannot tell a missing image from a broken read, so it is failing rather than passing."
        else
          echo "::error::ghcr.io/${repo}:${VERSION} is not in the registry. The registry answered with ${count} other tags, so this is the image missing rather than the check failing. Check the docker job for why the push did not land."
        fi
        exit 1
