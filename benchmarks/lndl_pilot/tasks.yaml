  prompt: List all the members of the MessageRole enum from lionagi/protocols/messages/base.py.
  accept:
    all_of:
    - system
    - user
    - assistant
    - unset
    - action
  truth: 'lionagi/protocols/messages/base.py:21-28 — class MessageRole: SYSTEM=''system'', USER=''user'',
    ASSISTANT=''assistant'', UNSET=''unset'', ACTION=''action''; 5 members'
  reference_answer: 'MessageRole has 5 members: system, user, assistant, unset, action.'
  decoy_answer: 'MessageRole has 4 members: system, user, assistant, tool.'
  enumerate_command: git -C tree grep -n 'class MessageRole' lionagi/protocols/messages/base.py; then
    sed -n '21,28p' lionagi/protocols/messages/base.py
  enumerate_known_member: system (lionagi/protocols/messages/base.py:24)
