- id: t20
  class: trace
  prompt: When the agent factory encounters tool_spec == 'search' in _register_tools, what class does
    it import, what argument does it pass to its constructor, and which module defines that class?
  accept:
    all_of:
    - SearchTool
    - workspace_root
    - 're:lionagi/tools/code/search\.py|lionagi\.tools\.code\.search\b'
  truth: lionagi/agent/factory.py:512-519 — imports SearchTool from lionagi.tools.code.search, constructs
    SearchTool(workspace_root=workspace_root); SearchTool defined at lionagi/tools/code/search.py:193
  reference_answer: It imports SearchTool from lionagi.tools.code.search, passes workspace_root=<str>
    to the constructor. SearchTool is defined in lionagi/tools/code/search.py.
  decoy_answer: It imports ReaderTool from lionagi.tools.file.reader, passes no arguments. ReaderTool
    is defined in lionagi/tools/file/reader.py.
- id: t21
  class: trace
  prompt: When an API model tool loop runs, _make_api_agent_spec builds an AgentSpec. What does it set
    spec.coding_tools to, and which function does it call to wire the security guards? Trace the two calls.
  accept:
    all_of:
    - _API_TOOL_SETS
    - _wire_secure_guards
  truth: lionagi/cli/agent.py:265-271 — spec.coding_tools = _API_TOOL_SETS[tools] (line 271); _wire_secure_guards(spec,
    cwd) (line 272); _wire_secure_guards defined at lionagi/agent/spec.py:44
  reference_answer: It sets spec.coding_tools to _API_TOOL_SETS[tools] and calls _wire_secure_guards(spec,
    cwd) to wire guard_destructive and guard_paths.
  decoy_answer: It sets spec.coding_tools to DEFAULT_CODING_TOOLS and calls _register_coding_tools directly.
- id: t22
  class: trace
  prompt: When _wire_secure_guards is called for an AgentSpec, which two hook handlers does it register,
    and on which tools does it register the path guard? Trace the guard_paths registration.
  accept:
    all_of:
    - guard_destructive
    - guard_paths
    - bash
    - reader
    - editor
  truth: lionagi/agent/spec.py:48-56 — imports guard_destructive, guard_paths from lionagi.agent.hooks;
    spec.security_pre('bash', guard_destructive); path_guard = guard_paths(allowed_paths=[workspace_root]);
    spec.security_pre('reader', path_guard); spec.security_pre('editor', path_guard)
  reference_answer: It registers guard_destructive on bash, and guard_paths (with the workspace root)
    on reader and editor.
  decoy_answer: It registers guard_paths on bash and guard_destructive on reader.
- id: t23
  class: trace
  prompt: The MCP config module defines JOB_MARKER_ENV_VAR. What is its string value, and which module
    reads it via the _apply_detached_execution_boundary function to prepend the detached execution boundary
    text? Trace the constant to its consumer.
  accept:
    all_of:
    - LIONAGI_MCP_JOB_RUN_ID
    - _apply_detached_execution_boundary
  truth: lionagi/mcp/config.py:35 — JOB_MARKER_ENV_VAR = 'LIONAGI_MCP_JOB_RUN_ID'; lionagi/cli/agent.py:25
    — imports JOB_MARKER_ENV_VAR from lionagi.mcp.config; lionagi/cli/agent.py:114-116 — _apply_detached_execution_boundary
    reads os.environ.get(JOB_MARKER_ENV_VAR)
  reference_answer: JOB_MARKER_ENV_VAR is 'LIONAGI_MCP_JOB_RUN_ID'. The _apply_detached_execution_boundary
    function in lionagi/cli/agent.py reads it to decide whether to prepend the detached execution boundary.
  decoy_answer: JOB_MARKER_ENV_VAR is 'LIONAGI_RUN_ID'. The _seed_injection_stats function reads it.
- id: t24
  class: trace
  prompt: The LIONAGI_HOME path constant is used by the MCP config module. What does it default to when
    the LIONAGI_HOME env var is not set, and which two path constants does the MCP config module derive
    from it (RUNS_DIR and JOBS_DIR)? Trace the import.
  accept:
    all_of:
    - .lionagi
    - 're:RUNS_DIR\W{0,5}=\s*\W{0,3}RUNS_ROOT'
    - 're:JOBS_DIR\W{0,5}=\s*\W{0,3}LIONAGI_HOME'
  truth: lionagi/_paths.py:20 — LIONAGI_HOME = Path(os.environ.get('LIONAGI_HOME', Path.home() / '.lionagi'));
    lionagi/mcp/config.py:16 — imports LIONAGI_HOME, RUNS_ROOT from lionagi._paths; config.py:19 — RUNS_DIR
    = RUNS_ROOT; config.py:23 — JOBS_DIR = LIONAGI_HOME / 'mcp' / 'jobs'
  reference_answer: LIONAGI_HOME defaults to ~/.lionagi (Path.home() / '.lionagi'). The MCP config module
    derives RUNS_DIR (= RUNS_ROOT) and JOBS_DIR (= LIONAGI_HOME / 'mcp' / 'jobs') from it.
  decoy_answer: LIONAGI_HOME defaults to ~/.lionagi/runs. The MCP config module derives RUNS_DIR from
    it.
