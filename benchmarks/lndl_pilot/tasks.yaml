tasks:
- id: t01
  class: lookup
  prompt: What is the value of the MAX_SPEC_PROMPT_CHARS constant in this codebase?
  accept:
    all_of:
    - '262144'
  truth: lionagi/_spec_limits.py:11 — MAX_SPEC_PROMPT_CHARS = 256 * 1024 = 262144
  reference_answer: MAX_SPEC_PROMPT_CHARS is 262144 (256 * 1024), defined in lionagi/_spec_limits.py.
  decoy_answer: MAX_SPEC_PROMPT_CHARS is 131072 (128 * 1024).
- id: t02
  class: lookup
  prompt: What is the __version__ string in lionagi/version.py?
  accept:
    all_of:
    - 0.35.5
  truth: lionagi/version.py:1 — __version__ = "0.35.5"
  reference_answer: The version is 0.35.5.
  decoy_answer: The version is 0.34.5.
- id: t03
  class: lookup
  prompt: What is the default max_tokens value the Anthropic messages endpoint gets when no output limit
    is named?
  accept:
    all_of:
    - '8192'
  truth: lionagi/cli/agent.py:89 — _ANTHROPIC_DEFAULT_MAX_TOKENS = 8192
  reference_answer: The Anthropic default max_tokens is 8192.
  decoy_answer: The Anthropic default max_tokens is 4096.
- id: t04
  class: lookup
  prompt: What is the default maximum number of extensions (rounds after the first) for an API model's
    tool loop?
  accept:
    all_of:
    - '10'
  truth: lionagi/cli/agent.py:87 — _API_DEFAULT_MAX_EXTENSIONS = 10
  reference_answer: The default max_extensions is 10.
  decoy_answer: The default max_extensions is 20.
- id: t05
  class: lookup
  prompt: What is the default max_tokens value for the BashTool's timeout field in milliseconds?
  accept:
    all_of:
    - '30000'
  truth: lionagi/tools/code/bash.py:35 — BashRequest.timeout description says Defaults to 30000 (30 s)
  reference_answer: The default timeout is 30000 ms (30 s).
  decoy_answer: The default timeout is 60000 ms (60 s).
- id: t06
  class: cross
  prompt: The BashTool in lionagi/tools/code/bash.py imports a subprocess helper and a regex constant
    from lionagi/tools/_subprocess.py. What is the maximum output bytes that the subprocess helper captures
    before truncating, and what is the name of the regex constant used to reject shell control operators?
  accept:
    all_of:
    - 're:\b100[,_ ]?000\b'
    - _SHELL_CONTROL
    none_of: []
  truth: lionagi/tools/_subprocess.py:20 — _MAX_OUTPUT_BYTES = 100_000; lionagi/tools/_subprocess.py:18
    — _SHELL_CONTROL = re.compile(...); imported by lionagi/tools/code/bash.py:13 — from .._subprocess
    import _SHELL_CONTROL
  reference_answer: The subprocess helper captures at most 100000 bytes. The regex constant is _SHELL_CONTROL,
    defined in lionagi/tools/_subprocess.py and imported by the BashTool.
  decoy_answer: The subprocess helper captures at most 50000 bytes. The regex constant is _MAX_OUTPUT_BYTES.
- id: t07
  class: lookup
  prompt: What is the cache TTL in seconds for the reader tool's document conversion cache?
  accept:
    all_of:
    - '300'
  truth: lionagi/tools/file/reader.py:24 — _CACHE_TTL_SECONDS = 300
  reference_answer: The cache TTL is 300 seconds (5 minutes).
  decoy_answer: The cache TTL is 600 seconds (10 minutes).
- id: t08
  class: cross
  prompt: The _API_TOOL_SETS dictionary maps the key 'read' to a tuple of three tool names. What are those
    three tool names, and which module defines the mapping?
  accept:
    all_of:
    - reader
    - search
    - context
  truth: 'lionagi/cli/agent.py:83 — _API_TOOL_SETS = {''read'': (''reader'', ''search'', ''context'')};
    tools at lionagi/tools/file/reader.py (ReaderTool), lionagi/tools/code/search.py (SearchTool), lionagi/tools/context/context.py
    (ContextTool)'
  reference_answer: The 'read' key maps to ('reader', 'search', 'context'), defined in lionagi/cli/agent.py.
  decoy_answer: The 'read' key maps to ('reader', 'editor', 'bash'), defined in lionagi/cli/agent.py.
- id: t09
  class: cross
  prompt: The PermissionPolicy class has a read_only classmethod. Which three tools does it allow with
    wildcard patterns, and which two tools does it deny?
  accept:
    all_of:
    - reader
    - search
    - context
    - editor
    - bash
  truth: lionagi/agent/permissions.py:83-88 — read_only() allows reader/search/context ['*'], denies editor
    and bash ['*']
  reference_answer: read_only allows reader, search, and context; it denies editor and bash.
  decoy_answer: read_only allows reader, editor, and bash; it denies context.
- id: t10
  class: cross
  prompt: The HookPoint enum in the hooks bus defines a closed vocabulary of lifecycle points. Which points
    are in the DORMANT_POINTS frozenset, and which points are in the _BLOCKING_POINTS frozenset?
  accept:
    all_of:
    - ARTIFACT_CREATED
    - TOOL_PRE
    - USER_PROMPT_SUBMIT
  truth: lionagi/hooks/bus.py:71 — DORMANT_POINTS = frozenset({HookPoint.ARTIFACT_CREATED}); lionagi/hooks/bus.py:76
    — _BLOCKING_POINTS = frozenset({HookPoint.TOOL_PRE, HookPoint.USER_PROMPT_SUBMIT})
  reference_answer: DORMANT_POINTS contains ARTIFACT_CREATED; _BLOCKING_POINTS contains TOOL_PRE and USER_PROMPT_SUBMIT.
  decoy_answer: DORMANT_POINTS contains TOOL_PRE; _BLOCKING_POINTS contains ARTIFACT_CREATED and SESSION_START.
- id: t11
  class: cross
  prompt: The DEFAULT_CODING_TOOLS tuple lists the coding tools bound by CodingToolkit. How many tools
    does it list, and does it include 'context'?
  accept:
    all_of:
    - '8'
    - context
  truth: lionagi/tools/coding.py:286-294 — DEFAULT_CODING_TOOLS = ('reader', 'editor', 'bash', 'search',
    'code_check', 'code_nav', 'ast_search', 'context') — 8 items including context
  reference_answer: 'DEFAULT_CODING_TOOLS lists 8 tools: reader, editor, bash, search, code_check, code_nav,
    ast_search, context. Yes, it includes context.'
  decoy_answer: 'DEFAULT_CODING_TOOLS lists 7 tools: reader, editor, bash, search, code_check, code_nav,
    ast_search. No, it does not include context.'
- id: t12
  class: cross
  prompt: The dispatch outbox has DEFAULT_MAX_ATTEMPTS and NOTIFY_TIMEOUT_SECONDS constants. What are
    their values, and what is the base backoff in seconds?
  accept:
    all_of:
    - '8'
    - '10'
    - '30'
  truth: lionagi/dispatch/outbox.py:48 — DEFAULT_MAX_ATTEMPTS = 8; outbox.py:49 — NOTIFY_TIMEOUT_SECONDS
    = 10.0; outbox.py:55 — _BASE_BACKOFF_SECONDS = 30
  reference_answer: DEFAULT_MAX_ATTEMPTS is 8, NOTIFY_TIMEOUT_SECONDS is 10.0, and the base backoff is
    30 seconds.
  decoy_answer: DEFAULT_MAX_ATTEMPTS is 5, NOTIFY_TIMEOUT_SECONDS is 15.0, and the base backoff is 60
    seconds.
- id: t13
