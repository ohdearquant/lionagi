[project]
name = "lion-cli"
version = "1.0.0a0"
description = "`lion`: the command line of lion1, one entry with subcommands."
requires-python = ">=3.11"
dependencies = [
    "lion1",
    "prompt-toolkit>=3.0.36",
    "rich>=13",
]

[project.scripts]
lion = "lion_cli.main:main"

[project.optional-dependencies]
voice = [
    "mlx-whisper>=0.4",
    "sounddevice>=0.5",
]

[tool.uv.sources]
lion1 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lion_cli"]
