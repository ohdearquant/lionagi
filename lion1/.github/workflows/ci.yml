name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HYPOTHESIS_PROFILE: ci
  FORCE_COLOR: "1"

# One hosted job, the required check: lint and the suite with coverage on Linux and the lowest
# supported Python. The other interpreters, the lowest declared dependencies and the built wheel run
# locally before a merge.
jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: pre-commit (ruff, ruff format, the ADR register)
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: the interpreter is 3.11
        run: uv run --locked --python 3.11 python -c "import sys; assert sys.version.startswith('3.11.'), sys.version; print(sys.version)"
      - name: pytest
        run: uv run --locked --python 3.11 pytest --cov --cov-report=term-missing
