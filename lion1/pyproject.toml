[project]
name = "lion1"
version = "1.0.0a0"
description = "An agent runtime: a model speaks in LNDL, handlers act, the record remembers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
daytona = ["daytona>=0.100"]  # hub.tools.daytona: a box on Daytona
runta = ["runta-sdk>=0.2.1"]  # hub.tools.runta: a box on Runta
serve = ["fastapi>=0.115", "uvicorn>=0.30", "h11>=0.16"]  # hub.serve over HTTP; h11 0.16: a chunk must end in CRLF

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "hypothesis>=6.100",
    "lion-cli",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.uv.workspace]
members = ["apps/cli"]

[tool.uv.sources]
lion-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lion1", "hub"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/cli/tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["lion1"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/lion1/"]
pytest_add_cli_args_test_selection = ["tests/"]
# the exports test reads module source, which mutmut rewrites; the hygiene test lists the tree
# through git, and mutmut runs the suite from a copy git does not track; the examples test runs the
# scripts under examples/, which that copy does not hold
pytest_add_cli_args = [
    "--ignore=tests/test_exports.py",
    "--ignore=tests/test_hygiene.py",
    "--ignore=tests/test_examples.py",
]
