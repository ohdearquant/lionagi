[project]
name = "lionagi"
version = "1.0.0a0"
description = "An agent runtime: a model speaks in LNDL, handlers act, the record remembers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lionagi"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["lionagi"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
paths_to_mutate = ["lionagi/"]
tests_dir = ["tests/"]
